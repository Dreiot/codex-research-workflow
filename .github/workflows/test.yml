name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: >-
          python -m py_compile
          skills/codex-research-workflow/scripts/workflow.py
          skills/codex-research-workflow/scripts/hook.py
          skills/research-artifact-cleanup/scripts/cleanup.py
      - name: Run integration tests
        run: python -m unittest discover -s tests -v
