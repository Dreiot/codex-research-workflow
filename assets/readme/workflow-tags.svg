<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
  <title id="title">Codex Research Workflow capabilities</title>
  <desc id="desc">Four labels: exploration first, canonical state, claim-aware, and Codex plus Work.</desc>

  <rect x="1" y="1" width="1198" height="90" rx="8" fill="#f7f5ef" stroke="#17191b" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">
    <g transform="translate(30 22)">
      <rect width="266" height="48" rx="5" fill="#17191b"/>
      <rect x="16" y="16" width="16" height="16" rx="2" fill="#2f7d62"/>
      <text x="48" y="31" fill="#f7f5ef">EXPLORATION FIRST</text>
    </g>
    <g transform="translate(322 22)">
      <rect width="266" height="48" rx="5" fill="#ffffff" stroke="#17191b" stroke-width="2"/>
      <rect x="16" y="16" width="16" height="16" rx="2" fill="#c78b2d"/>
      <text x="48" y="31" fill="#17191b">CANONICAL STATE</text>
    </g>
    <g transform="translate(614 22)">
      <rect width="266" height="48" rx="5" fill="#ffffff" stroke="#17191b" stroke-width="2"/>
      <rect x="16" y="16" width="16" height="16" rx="2" fill="#b94d4d"/>
      <text x="48" y="31" fill="#17191b">CLAIM-AWARE</text>
    </g>
    <g transform="translate(906 22)">
      <rect width="264" height="48" rx="5" fill="#ffffff" stroke="#17191b" stroke-width="2"/>
      <rect x="16" y="16" width="16" height="16" rx="2" fill="#2f7d62"/>
      <text x="48" y="31" fill="#17191b">CODEX + WORK</text>
    </g>
  </g>
</svg>
