<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Codex Research Workflow</title>
  <desc id="desc">An evidence-led research operating system connecting three canonical project files to fast experiments, reviewable evidence, and approved cleanup.</desc>
  <defs>
    <pattern id="paper-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D8D1C4" stroke-width="1" opacity=".42"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2457D6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="458" rx="22" fill="#F3EFE6" stroke="#14161A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="458" rx="22" fill="url(#paper-grid)"/>
  <path d="M0 74H1200" stroke="#14161A" stroke-width="2"/>
  <path d="M760 74V460" stroke="#14161A" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="38" y="45" fill="#2457D6" font-weight="700">RESEARCH OPERATING SYSTEM / v1</text>
    <text x="1162" y="45" text-anchor="end" fill="#676B73">GIT-VERIFIED · RESUMABLE · CLAIM-AWARE</text>
  </g>

  <g transform="translate(46 112)">
    <text x="0" y="0" fill="#676B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">TWO CODEX SKILLS · ONE RESEARCH CONTRACT</text>
    <text x="0" y="70" fill="#14161A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="60" font-weight="760">CODEX RESEARCH</text>
    <text x="0" y="132" fill="#14161A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="60" font-weight="760">WORKFLOW</text>
    <rect x="0" y="158" width="92" height="7" fill="#D75945"/>
    <text x="0" y="211" fill="#34373D" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">Run the smallest credible experiment.</text>
    <text x="0" y="243" fill="#34373D" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">Keep every durable decision recoverable.</text>

    <g transform="translate(0 284)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <rect width="322" height="42" rx="4" fill="#14161A"/>
      <text x="18" y="27" fill="#F3EFE6">$codex-research-workflow</text>
      <rect x="336" width="322" height="42" rx="4" fill="#F3EFE6" stroke="#14161A" stroke-width="2"/>
      <text x="354" y="27" fill="#14161A">$research-artifact-cleanup</text>
    </g>
  </g>

  <g transform="translate(796 100)">
    <text x="0" y="0" fill="#676B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">CANONICAL PROJECT AUTHORITY</text>
    <path d="M18 42V252" stroke="#2457D6" stroke-width="3"/>

    <g transform="translate(0 28)">
      <circle cx="18" cy="32" r="8" fill="#2457D6"/>
      <rect x="42" y="0" width="312" height="66" rx="6" fill="#FFFFFF" stroke="#14161A" stroke-width="1.5"/>
      <text x="60" y="24" fill="#676B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">A/01 · STABLE RULES</text>
      <text x="60" y="49" fill="#14161A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">AGENTS.md</text>
    </g>

    <g transform="translate(0 116)">
      <circle cx="18" cy="32" r="8" fill="#2457D6"/>
      <rect x="42" y="0" width="312" height="66" rx="6" fill="#FFFFFF" stroke="#14161A" stroke-width="1.5"/>
      <text x="60" y="24" fill="#676B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">A/02 · DURABLE DIRECTION</text>
      <text x="60" y="49" fill="#14161A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">PROJECT_CORE.md</text>
    </g>

    <g transform="translate(0 204)">
      <circle cx="18" cy="32" r="8" fill="#D75945"/>
      <rect x="42" y="0" width="312" height="66" rx="6" fill="#FFFFFF" stroke="#14161A" stroke-width="1.5"/>
      <text x="60" y="24" fill="#676B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">A/03 · CURRENT GATE</text>
      <text x="60" y="49" fill="#14161A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">CURRENT_STAGE.md</text>
    </g>

    <path d="M174 280V301" stroke="#2457D6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="42" y="310" width="312" height="40" rx="20" fill="#14161A"/>
    <circle cx="67" cy="330" r="6" fill="#D75945"/>
    <text x="84" y="335" fill="#F3EFE6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">VERIFY BRANCH · HEAD · DIFF</text>
  </g>
</svg>
