<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Artifact cleanup is an approved transaction</title>
  <desc id="desc">Metadata inventory becomes a state-bound plan, pauses for user approval, then relocates or deletes only the approved paths before verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2457D6"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="#F3EFE6" stroke="#14161A" stroke-width="2"/>
  <text x="38" y="47" fill="#14161A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="720">Cleanup is a transaction, not a guess</text>
  <text x="1162" y="46" text-anchor="end" fill="#676B73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">DELETE NOTHING FROM AN UNAPPROVED INVENTORY</text>
  <path d="M38 67H1162" stroke="#BDB7AC"/>

  <g transform="translate(38 101)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <text x="0" y="0" fill="#2457D6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">C/01</text>
      <text x="0" y="34" fill="#14161A" font-size="20" font-weight="700">Inventory metadata</text>
      <text x="0" y="63" fill="#676B73" font-size="14">paths · bytes · refs · Git state</text>
      <rect x="0" y="84" width="224" height="44" rx="5" fill="#FFFFFF" stroke="#14161A"/>
      <text x="16" y="112" fill="#14161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">no raw-data inspection</text>
    </g>
    <path d="M238 67H278" stroke="#2457D6" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(292)">
      <text x="0" y="0" fill="#2457D6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">C/02</text>
      <text x="0" y="34" fill="#14161A" font-size="20" font-weight="700">Bind the plan</text>
      <text x="0" y="63" fill="#676B73" font-size="14">HEAD · PROJECT_CORE · plan_id</text>
      <rect x="0" y="84" width="224" height="44" rx="5" fill="#14161A"/>
      <text x="16" y="112" fill="#F3EFE6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">cleanup-4e91…</text>
    </g>
    <path d="M530 67H570" stroke="#D75945" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(584)">
      <rect x="-15" y="-26" width="250" height="171" rx="8" fill="#FFFFFF" stroke="#D75945" stroke-width="3"/>
      <text x="0" y="0" fill="#D75945" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">C/03 · STOP</text>
      <text x="0" y="34" fill="#14161A" font-size="20" font-weight="700">User approves scope</text>
      <text x="0" y="63" fill="#676B73" font-size="14">numbered items + exact plan ID</text>
      <rect x="0" y="84" width="205" height="36" rx="18" fill="#D75945"/>
      <text x="102" y="108" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">APPROVAL REQUIRED</text>
    </g>
    <path d="M834 67H874" stroke="#2457D6" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(888)">
      <text x="0" y="0" fill="#2457D6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">C/04</text>
      <text x="0" y="34" fill="#14161A" font-size="20" font-weight="700">Apply + verify</text>
      <text x="0" y="63" fill="#676B73" font-size="14">relocate → references → delete</text>
      <rect x="0" y="84" width="236" height="44" rx="5" fill="#FFFFFF" stroke="#14161A"/>
      <circle cx="20" cy="106" r="6" fill="#2457D6"/>
      <text x="37" y="111" fill="#14161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">verified record</text>
    </g>
  </g>
  <g transform="translate(38 288)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <text x="0" y="0" fill="#676B73">PRESERVED BY DEFAULT</text>
    <text x="160" y="0" fill="#14161A">FORMAL EVIDENCE · NEGATIVE EVIDENCE · ACTIVE WORK · UNKNOWN</text>
  </g>
</svg>
